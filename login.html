<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login</title>
    <link rel="stylesheet" href="login.css" />
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <h2>Login to StudentHub</h2>
            <p class="subtext">Don't have an account yet? <a href="signup.html">Sign Up</a></p>
            <form onsubmit="login(event)">
                <label>Email Address</label>
                <input type="email" placeholder="you@example.com" required />

                <div class="password-field">
                    <label>Password</label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>
                <input type="password" placeholder="Enter 6 characters or more" required />

                <div class="remember-me">
                    <input type="checkbox" id="remember" />
                    <label for="remember">Remember me</label>
                </div>

                <button type="submit" class="login-btn">LOGIN</button>
            </form>

            <div class="or-section">
                <p>or login with</p>
            </div>

            <button class="vu-id">Login with VU-ID</button>
        </div>

        <div class="illustration">
            <img src="login.webp" alt="Illustration" />
        </div>
    </div>

<script>
    function login(e) {
        e.preventDefault();
        sessionStorage.setItem("loggedInUser", "true");
        window.location.href = "index.html";
    }
</script>
</body>
</html>
