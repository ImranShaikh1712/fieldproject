<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="login.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <h2>Sign Up</h2>
            <p class="subtext">Already have an account? <a href="login.html">Login</a></p>
            <form id="signupForm">
                <label>Full Name</label>
                <input type="text" placeholder="Your Full Name" id="fullname" required>

                <label>Email Address</label>
                <input type="email" placeholder="you@example.com" id="email" required>

                <label>Password</label>
                <input type="password" placeholder="Enter 6 characters or more" id="password" required>

                <button type="submit" class="login-btn">SIGN UP</button>
            </form>
        </div>
        <div class="illustration">
            <img src="login.webp" alt="Illustration">
        </div>
    </div>
    <script src="signup.js"></script>
</body>
</html>
